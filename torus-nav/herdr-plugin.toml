id = "naoyafurudono.torus-nav"
name = "Torus Nav"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Move pane focus with wraparound at the tab edges (the pane layout becomes a torus)"
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-trimpath", "-ldflags=-s -w", "-o", "torus-nav", "."]

[[actions]]
id = "left"
title = "Focus the pane to the left (wrap to the right edge)"
contexts = ["workspace"]
command = ["./torus-nav", "left"]

[[actions]]
id = "down"
title = "Focus the pane below (wrap to the top edge)"
contexts = ["workspace"]
command = ["./torus-nav", "down"]

[[actions]]
id = "up"
title = "Focus the pane above (wrap to the bottom edge)"
contexts = ["workspace"]
command = ["./torus-nav", "up"]

[[actions]]
id = "right"
title = "Focus the pane to the right (wrap to the left edge)"
contexts = ["workspace"]
command = ["./torus-nav", "right"]
